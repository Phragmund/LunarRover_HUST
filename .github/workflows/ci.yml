name: ROS 2 Humble CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Static validation
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml python3-pytest
          make validate
      - name: Install ROS 2 and Gazebo dependencies
        run: ./scripts/bootstrap_humble.sh
      - name: Import pinned dependencies
        run: ./scripts/import_dependencies.sh
      - name: Import hardware sensor dependencies
        run: ./scripts/import_hardware_dependencies.sh
      - name: Build
        run: ./scripts/build.sh
      - name: Test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
