bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 20.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.25
      lookahead_dist: 0.45
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.65
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.60
      transform_tolerance: 0.20
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.04
      approach_velocity_scaling_dist: 0.60
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.70
      regulated_linear_scaling_min_speed: 0.08
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.0
      max_robot_pose_search_dist: 5.0
      use_interpolation: true
      cost_scaling_dist: 0.18
      cost_scaling_gain: 0.32
      inflation_cost_scaling_factor: 4.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.20
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.45, 0.33], [0.45, -0.33], [-0.45, -0.33], [-0.45, 0.33]]"
      footprint_padding: 0.02
      track_unknown_space: true
      plugins: [terrain_layer, voxel_layer, inflation_layer]
      terrain_layer:
        plugin: lunar_rover_navigation::TerrainLayer
        enabled: true
        topic: /terrain/traversability
        lethal_threshold: 100
        unknown_is_lethal: true
        transform_tolerance: 0.10
        maximum_map_age: 0.60
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: -0.30
        z_resolution: 0.10
        z_voxels: 16
        max_obstacle_height: 1.30
        mark_threshold: 1
        observation_sources: lidar depth
        lidar:
          topic: /livox/points
          data_type: PointCloud2
          min_obstacle_height: -0.20
          max_obstacle_height: 1.30
          clearing: true
          marking: true
          raytrace_min_range: 0.20
          raytrace_max_range: 8.0
          obstacle_min_range: 0.20
          obstacle_max_range: 6.0
          observation_persistence: 0.0
          expected_update_rate: 0.15
        depth:
          topic: /camera/depth_registered/points
          data_type: PointCloud2
          min_obstacle_height: -0.20
          max_obstacle_height: 1.30
          clearing: true
          marking: true
          raytrace_min_range: 0.15
          raytrace_max_range: 4.0
          obstacle_min_range: 0.15
          obstacle_max_range: 3.5
          observation_persistence: 0.0
          expected_update_rate: 0.20
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        cost_scaling_factor: 4.0
        inflation_radius: 0.20
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.30
      resolution: 0.05
      footprint: "[[0.45, 0.33], [0.45, -0.33], [-0.45, -0.33], [-0.45, 0.33]]"
      footprint_padding: 0.02
      track_unknown_space: true
      plugins: [static_layer, terrain_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      terrain_layer:
        plugin: lunar_rover_navigation::TerrainLayer
        enabled: true
        topic: /terrain/traversability
        lethal_threshold: 100
        unknown_is_lethal: true
        transform_tolerance: 0.20
        maximum_map_age: 0.60
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        cost_scaling_factor: 4.0
        inflation_radius: 0.20
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.15
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      cost_travel_multiplier: 3.0
      use_final_approach_orientation: false
      smooth_path: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, assisted_teleop, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.20
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.60
    min_rotational_vel: 0.10
    rotational_acc_lim: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 10
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: CLOSED_LOOP
    max_velocity: [0.25, 0.0, 0.60]
    min_velocity: [-0.12, 0.0, -0.60]
    max_accel: [0.35, 0.0, 1.0]
    max_decel: [-0.60, 0.0, -1.2]
    odom_topic: /odometry/filtered
    odom_duration: 0.20
    deadband_velocity: [0.005, 0.0, 0.01]
    velocity_timeout: 0.25

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel
    cmd_vel_out_topic: /cmd_vel_safe
    transform_tolerance: 0.20
    source_timeout: 0.50
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: [StopZone, SlowZone, FootprintApproach]
    StopZone:
      type: polygon
      points: [0.55, 0.40, 0.55, -0.40, -0.50, -0.40, -0.50, 0.40]
      action_type: stop
      max_points: 2
      visualize: true
      polygon_pub_topic: collision_monitor/stop_zone
      enabled: true
    SlowZone:
      type: polygon
      points: [0.80, 0.55, 0.80, -0.55, -0.65, -0.55, -0.65, 0.55]
      action_type: slowdown
      max_points: 2
      slowdown_ratio: 0.32
      visualize: true
      polygon_pub_topic: collision_monitor/slow_zone
      enabled: true
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.5
      simulation_time_step: 0.10
      max_points: 2
      visualize: false
      enabled: true
    observation_sources: [terrain_obstacles, depth]
    terrain_obstacles:
      type: pointcloud
      topic: /terrain/obstacles
      min_height: -1.0
      max_height: 1.5
      enabled: true
    depth:
      type: pointcloud
      topic: /camera/depth_registered/points
      min_height: -0.20
      max_height: 1.30
      enabled: true
