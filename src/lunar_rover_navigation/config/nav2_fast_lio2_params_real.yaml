controller_server:
  ros__parameters:
    use_sim_time: false
    # Keep a modest transform tolerance for transient TF pipeline latency.
    # map->odom is now published at current sim time from the latest cached
    # FAST-LIO correction, while odom->base_link carries the high-rate motion.
    transform_tolerance: 0.2
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 45.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.70
    FollowPath:
      # MPPI local controller (plan section 15)
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 40
      model_dt: 0.05
      batch_size: 500
      vx_std: 0.06
      vy_std: 0.20
      wz_std: 0.30
      # Computer takeover is limited to half of the phone full-stick speed
      # (0.09375 m/s) for safer real-rover autonomy.
      vx_max: 0.046875
      vy_max: 0.0
      wz_max: 0.235
      iteration_count: 1
      temperature: 0.30
      gamma: 0.015
      motion_model: DiffDrive
      # Publish sampled MPPI candidates and the chosen local trajectory on
      # /trajectories so RViz can make controller decisions inspectable.
      visualize: true
      critics: [ObstaclesCritic, PathAlignCritic, PathFollowCritic, GoalCritic, GoalAngleCritic, PreferForwardCritic]
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 100000.0
        collision_margin_distance: 0.05
        near_goal_distance: 0.5
        # Was 0.55: far too conservative for a 0.40 m-wide rover in a 1.0 m
        # corridor.  0.55 inflated every 0.20 m obstacle sphere into a ~0.75 m
        # blob, leaving MPPI no valid trajectory past a sphere ("Optimizer fail
        # to compute path" + "Collision Ahead - Exiting Spin" -> goal status 6).
        # Reduced from 0.20 to match the (now 0.05) global inflation.  With
        # consider_footprint already checking the full 0.40 m footprint, a 0.20 m
        # inflation double-counted and left MPPI no valid trajectory through a
        # doorway that contained a rock.  Hard collision safety still comes from
        # consider_footprint + collision_margin_distance (0.05) + collision_cost.
        inflation_radius: 0.05
        cost_scaling_factor: 3.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.40
        offset_from_furthest: 20
        path_distance_lookahead: 0.20
        transform_tolerance: 1.0
      PathFollowCritic:
        enabled: true
        cost_power: 1
        threshold_to_consider: 0.40
        offset_from_furthest: 6
      GoalCritic:
        enabled: true
        cost_power: 1
        threshold_to_consider: 1.40
        power: 1
        weight: 5.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        threshold_to_consider: 0.50
        power: 1
        weight: 3.0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      track_unknown_space: false
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.26, 0.20], [0.26, -0.20], [-0.26, -0.20], [-0.26, 0.20]]"
      plugins: [terrain_layer]
      terrain_layer:
        plugin: lunar_rover_navigation/TerrainLayer
        enabled: true
        topic: /terrain/traversability
        lethal_threshold: 100
        unknown_cost: 0
        cost_scale: 1.0
        transform_tolerance: 1.00
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.26, 0.20], [0.26, -0.20], [-0.26, -0.20], [-0.26, 0.20]]"
      resolution: 0.05
      width: 22
      height: 16
      origin_x: -11.0
      origin_y: -8.0
      track_unknown_space: true
      plugins: [terrain_layer, inflation_layer]
      terrain_layer:
        plugin: lunar_rover_navigation/TerrainLayer
        enabled: true
        topic: /terrain/traversability
        lethal_threshold: 100
        unknown_cost: 255
        cost_scale: 1.45
        transform_tolerance: 1.00
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Reduced from 0.20: the SmacPlannerHybrid already applies the footprint's
        # inscribed radius (0.20 m) as its own collision margin, so a 0.20 m
        # inflation layer double-counted to 0.40 m of clearance and sealed every
        # doorway that held a 7 cm rock.  0.05 m is a small safety margin only;
        # the footprint collision + MPPI collision_margin provide the real safety.
        inflation_radius: 0.05
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: false
    transform_tolerance: 0.2
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      # Six-wheel rocker-bogie skid-steer rover.
      # NOTE: SmacPlannerLattice needs a lattice file at the SAME resolution as the
      # costmap. SmacPlannerHybrid (same Smac family) builds its own motion model
      # at costmap resolution and has been reliable for the online terrain layer.
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 2000000
      # max_on_approach_iterations caps the A* expansion once the goal is within
      # lookup_table_size (20.0 m) of the start.  The maze is only ~9 m across,
      # so EVERY goal triggered the 1000-iteration "on-approach" cap, and 1000
      # REEDS_SHEPP expansions only reach ~1 m -> any frontier goal >1 m away
      # failed with "no valid path found" (status 6).  Raising it to match
      # max_iterations lets the planner always search with the full budget.
      max_on_approach_iterations: 2000000
      max_planning_time: 10.0
      analytic_expansion_ratio: 3.0
      analytic_expansion_max_length: 3.0
      cache_obstacle_heuristic: false
      motion_model_for_search: REEDS_SHEPP
      minimum_turning_radius: 0.05
      angle_quantization_bins: 72
      reverse_penalty: 1.5
      allow_reverse_expansion: true
      lookup_table_size: 14.0
      use_final_approach_orientation: false
      # The global costmap used to be 0.025 m/cell, so a 20 m lookup table meant an
      # 800-cell-radius Reeds-Shepp heuristic grid (~2.6M cells) that
      # SmacPlannerHybrid precomputes at configure() time.  Under full sim
      # load that took ~33 s, blowing past nav2_lifecycle_bringup's
      # call_timeout and killing planner activation ("failed to reach
      # inactive").  Keeping the 2x search downsampling and 14 m lookup table
      # keeps planner startup cheap while the displayed costmap is 0.05 m/cell.
      downsample_costmap: true
      downsampling_factor: 2

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 1.00
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.42
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.80

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.046875, 0.0, 0.235]
    min_velocity: [-0.046875, 0.0, -0.235]
    max_accel: [0.35, 0.0, 0.80]
    max_decel: [-0.45, 0.0, -0.90]
    odom_topic: /localization/lio_odometry
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
