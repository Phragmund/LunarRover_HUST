icp_odometry:
  ros__parameters:
    frame_id: base_link
    odom_frame_id: odom
    publish_tf: true
    wait_for_transform: 0.2
    expected_update_rate: 8.0
    max_update_rate: 8.0
    publish_null_when_lost: true
    Odom/Strategy: "0"
    Odom/GuessMotion: "true"
    Odom/GuessSmoothingDelay: "0.4"
    Odom/Holonomic: "false"
    Odom/FilteringStrategy: "1"
    Odom/ScanKeyFrameThr: "0.75"
    Odom/ResetCountdown: "3"
    Odom/Deskewing: "false"
    Icp/Strategy: "1"
    Icp/Force4DoF: "true"
    Icp/PointToPlane: "true"
    Icp/PointToPlaneK: "10"
    Icp/PointToPlaneMinComplexity: "0.001"
    Icp/PointToPlaneLowComplexityStrategy: "1"
    Icp/VoxelSize: "0.08"
    Icp/RangeMin: "0.4"
    Icp/RangeMax: "12.0"
    Icp/MaxCorrespondenceDistance: "0.35"
    Icp/CorrespondenceRatio: "0.04"
    Icp/Iterations: "30"
    Icp/MaxTranslation: "0.35"
    Icp/MaxRotation: "0.35"
    Icp/OutlierRatio: "0.75"
    Icp/ReciprocalCorrespondences: "true"
