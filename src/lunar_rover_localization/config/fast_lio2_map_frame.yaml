fast_lio2_map_frame:
  ros__parameters:
    use_sim_time: true
    map_frame: map
    base_frame: base_link
    lio_body_frame: livox_imu_frame
    imu_topic: /livox/imu
    imu_mount_pitch_source: fixed
    imu_mount_pitch_deg: 35.273
    imu_mount_pitch_samples: 80
    imu_mount_pitch_max_gyro_radps: 0.02
    imu_mount_pitch_correction_deg: 0.0
    raw_lio_map_frame: camera_init
    raw_odom_topic: /localization/lio_odometry_raw
    raw_path_topic: /localization/lio_path_raw
    raw_registered_topic: /localization/cloud_registered_raw
    raw_map_cloud_topic: /localization/lio_map_cloud_raw
    odom_topic: /localization/lio_odometry
    path_topic: /localization/lio_path
    registered_topic: /localization/cloud_registered
    map_cloud_topic: /localization/lio_map_cloud
    restamp_outputs: true
    publish_odom: true
    publish_path: false
    publish_registered_cloud: false
    publish_map_cloud: false
    path_max_rate_hz: 0.0
    path_max_poses: 0
    registered_cloud_max_rate_hz: 0.0
    map_cloud_max_rate_hz: 0.0
    max_abs_position: 1000.0
    require_valid_pose_for_clouds: true
    level_correction_source: fixed
    level_correction_samples: 40
    level_correction_start_delay_sec: 20.0
    level_correction_max_abs_tilt_deg: 10.0
    level_correction_preserve_yaw: true
    level_correction_anchor_position: true
    level_correction_roll_deg: -0.58
    level_correction_pitch_deg: -0.67
    level_correction_yaw_deg: 0.007
    ground_slope_correction_enabled: true
    ground_slope_correction_rate_hz: 1.0
    ground_slope_grid_resolution: 0.8
    ground_slope_ground_band: 0.12
    ground_slope_min_points_per_cell: 8
    ground_slope_min_cells: 80
    ground_slope_cloud_stride: 2
    ground_slope_max_points_per_cloud: 250000
    ground_slope_max_correction_deg: 6.0
    ground_slope_residual_limit: 0.12

