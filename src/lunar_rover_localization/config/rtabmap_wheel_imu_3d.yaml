rtabmap:
  ros__parameters:
    frame_id: base_footprint
    map_frame_id: map
    odom_frame_id: odom
    publish_tf: true
    subscribe_rgb: false
    subscribe_depth: false
    subscribe_rgbd: false
    subscribe_stereo: false
    subscribe_scan: false
    subscribe_scan_cloud: true
    subscribe_scan_descriptor: false
    subscribe_sensor_data: false
    subscribe_user_data: false
    subscribe_odom_info: false
    approx_sync: true
    queue_size: 20
    qos: 2
    wait_for_transform: 0.3
    use_action_for_goal: false
    map_always_update: true
    cloud_output_voxelized: true
    map_empty_ray_tracing: true
    RGBD/Enabled: "true"
    RGBD/NeighborLinkRefining: "false"
    RGBD/ProximityBySpace: "false"
    RGBD/ProximityByTime: "false"
    RGBD/CreateOccupancyGrid: "true"
    RGBD/LinearUpdate: "0.08"
    RGBD/AngularUpdate: "0.08"
    Reg/Strategy: "1"
    Reg/Force3DoF: "true"
    Grid/Sensor: "0"
    Grid/3D: "true"
    Grid/CellSize: "0.08"
    Grid/RangeMin: "0.4"
    Grid/RangeMax: "12.0"
    Grid/RayTracing: "true"
    Grid/NormalsSegmentation: "false"
    Grid/GroundIsObstacle: "true"
    Grid/MaxObstacleHeight: "0.0"
    Grid/MinGroundHeight: "0.0"
    Grid/MaxGroundHeight: "0.0"
    Grid/NoiseFilteringRadius: "0.12"
    Grid/NoiseFilteringMinNeighbors: "3"
    Mem/IncrementalMemory: "true"
    Mem/InitWMWithAllNodes: "false"
    Mem/LaserScanVoxelSize: "0.08"
    Mem/LaserScanNormalK: "10"
