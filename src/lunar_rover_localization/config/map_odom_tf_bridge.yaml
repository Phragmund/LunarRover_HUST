map_odom_tf_bridge:
  ros__parameters:
    use_sim_time: true
    lio_topic: /localization/lio_odometry
    local_odom_topic: /localization/composite_odometry
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    max_stamp_delta: 0.0
    max_lio_age: 2.0
    max_local_age: 2.0
    max_abs_lio_position: 1000.0
    publish_period: 0.02
