wheel_odometry_node:
  ros__parameters:
    use_sim_time: true
    steering_joints:
      - left_front_steering_joint
      - right_front_steering_joint
      - left_rear_steering_joint
      - right_rear_steering_joint
    wheel_joints:
      - left_front_wheel_joint
      - right_front_wheel_joint
      - left_middle_wheel_joint
      - right_middle_wheel_joint
      - left_rear_wheel_joint
      - right_rear_wheel_joint
    wheel_radius: 0.075
    wheelbase: 0.39
    track_width: 0.375
    joint_states_topic: /joint_states
    odometry_topic: /wheel/odometry
    odom_frame: odom
    base_frame: base_link
    publish_tf: false
    maximum_integration_dt: 0.5
    pose_covariance_diagonal: [0.02, 0.02, 0.0025, 1000000.0, 1000000.0, 0.05]
    twist_covariance_diagonal: [0.04, 1000000.0, 1000000.0, 1000000.0, 1000000.0, 0.08]

sim_chassis_state_node:
  ros__parameters:
    use_sim_time: true
    publish_rate: 20.0
    command_timeout: 0.25
    default_enabled: true
    operating_mode: autonomous
    command_topic: /chassis/cmd_vel
    state_topic: /chassis/state
    estop_topic: /chassis/emergency_stop
    enable_topic: /chassis/controller_enabled
    fault_topic: /chassis/fault_bits
