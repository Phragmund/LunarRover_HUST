elevation_grid:
  ros__parameters:
    use_sim_time: true
    input_topic: /livox/points
    elevation_topic: /terrain/elevation_cloud
    traversability_topic: /terrain/traversability
    current_voxel_topic: /terrain/current_voxels
    map_frame: map
    base_frame: base_link
    cell_size: 0.10
    width_cells: 160
    height_cells: 160
    rolling_window: false
    origin_x: -8.0
    origin_y: -8.0
    min_points_per_cell: 2
    min_z: -0.60
    max_z: 1.80
    obstacle_height: 0.28
    roughness_height: 0.08
    publish_current_voxels: true
    current_voxel_size: 0.10
    transform_timeout: 0.10
