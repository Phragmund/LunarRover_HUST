terrain_mapper:
  ros__parameters:
    use_sim_time: true
    input_topic: /localization/cloud_registered
    traversability_topic: /terrain/traversability
    diagnostics_topic: /terrain/diagnostics
    map_frame: map
    base_frame: base_link
    resolution: 0.05
    width_cells: 440
    height_cells: 320
    origin_x: -11.0
    origin_y: -8.0
    min_z: -0.80
    max_z: 1.80
    min_points_per_cell: 2
    cautious_step_height: 0.12
    lethal_step_height: 0.28
    max_slope_deg: 16.0
    lethal_slope_deg: 34.0
    roughness_warn: 0.06
    unknown_is_risky: false
    max_points_per_cloud: 60000
    publish_period: 0.5
    rolling_window: false
    recenter_margin_m: 6.0
    cell_decay_time: 0.0
    raytrace_free_space: true
    raytrace_stride: 6
    raytrace_max_range: 8.0
    raytrace_endpoint_margin: 0.20
    self_filter_enabled: true
    # Expanded bounding box.  Vehicle wheelbase 0.52 m, track 0.50 m,
    # wheel radius 0.0625 m.  The box must fully enclose the rover body
    # plus wheels so that self-points are not misinterpreted as terrain.
    self_filter_min_x: -0.40
    self_filter_max_x: 0.40
    self_filter_min_y: -0.35
    self_filter_max_y: 0.35
    self_filter_min_z: -0.50
    self_filter_max_z: 0.85
    clear_robot_footprint: true
