octomap_server:
  ros__parameters:
    use_sim_time: true
    frame_id: map
    base_frame_id: base_link
    resolution: 0.05
    sensor_model.max_range: 12.0
    sensor_model.hit: 0.7
    sensor_model.miss: 0.4
    sensor_model.min: 0.12
    sensor_model.max: 0.97
    pointcloud_min_z: -0.50
    pointcloud_max_z: 2.00
    filter_ground: false
    latch: false
