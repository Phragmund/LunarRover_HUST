mid360_sim_adapter:
  ros__parameters:
    use_sim_time: true
    input_topic: /sim/livox/points
    cloud_topic: /livox/points
    custom_topic: /livox/lidar
    output_frame: livox_frame
    scan_period: 0.1
    noise_stddev: 0.02
    noise_slope: 0.0005
    dropout_probability: 0.01
    timestamp_jitter_stddev: 0.0002
    min_range: 0.1
    max_range: 40.0
    random_seed: 360

