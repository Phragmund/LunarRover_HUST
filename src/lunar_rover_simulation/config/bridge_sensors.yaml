# Sensor Gazebo-to-ROS bridges. These can be delayed until the world has settled.
- ros_topic_name: /livox/scan
  gz_topic_name: /mid360/scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: ignition.msgs.LaserScan
  direction: GZ_TO_ROS
  lazy: false

- ros_topic_name: /mid360/raw_points
  gz_topic_name: /mid360/scan/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: ignition.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  lazy: false

- ros_topic_name: /mid360/raw_imu
  gz_topic_name: /mid360/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: ignition.msgs.IMU
  direction: GZ_TO_ROS
  lazy: false

- ros_topic_name: /livox/imu_raw
  gz_topic_name: /mid360/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: ignition.msgs.IMU
  direction: GZ_TO_ROS
  lazy: false

- ros_topic_name: /camera/color/image_raw
  gz_topic_name: /gemini335/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS
  lazy: false

- ros_topic_name: /camera/depth/image_raw
  gz_topic_name: /gemini335/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS
  lazy: false

- ros_topic_name: /camera/color/camera_info
  gz_topic_name: /gemini335/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: ignition.msgs.CameraInfo
  direction: GZ_TO_ROS
  lazy: false

- ros_topic_name: /camera/depth/camera_info
  gz_topic_name: /gemini335/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: ignition.msgs.CameraInfo
  direction: GZ_TO_ROS
  lazy: false
