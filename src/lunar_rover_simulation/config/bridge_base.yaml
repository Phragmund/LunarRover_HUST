# Core Gazebo-to-ROS bridges needed before sensors are enabled.
- ros_topic_name: /simulation/ground_truth/odometry
  gz_topic_name: /simulation/ground_truth/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: ignition.msgs.Odometry
  direction: GZ_TO_ROS
  lazy: false

- ros_topic_name: /simulation/collision
  gz_topic_name: /simulation/rock_collision/touched
  ros_type_name: std_msgs/msg/Bool
  gz_type_name: ignition.msgs.Boolean
  direction: GZ_TO_ROS
  lazy: false

- ros_topic_name: /simulation/collision
  gz_topic_name: /simulation/step_collision/touched
  ros_type_name: std_msgs/msg/Bool
  gz_type_name: ignition.msgs.Boolean
  direction: GZ_TO_ROS
  lazy: false
