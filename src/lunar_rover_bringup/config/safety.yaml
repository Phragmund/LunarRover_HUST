safety_supervisor:
  ros__parameters:
    publish_rate: 20.0
    command_timeout: 0.25
    lidar_timeout: 0.5
    terrain_timeout: 0.5
    odometry_timeout: 0.5
    chassis_timeout: 0.3
    slow_tilt_degrees: 15.0
    stop_tilt_degrees: 25.0
    max_linear_speed: 0.25
    max_angular_speed: 0.8
    input_cmd_topic: /cmd_vel_safe
    output_cmd_topic: /chassis/cmd_vel
    lidar_topic: /livox/points
    terrain_topic: /terrain/traversability
    odometry_topic: /odometry/filtered
    chassis_state_topic: /chassis/state
